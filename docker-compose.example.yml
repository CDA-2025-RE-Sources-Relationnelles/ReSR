services:
  db:
    image: postgres:14.22
    restart: always
    shm_size: 128mb
    networks:
      - resr
    environment:
      POSTGRES_PASSWORD: ${DB__Password}
      POSTGRES_USER: ${DB__Username}
      POSTGRES_DB: ${DB__Database}
    volumes:
      - resr-db:/var/lib/postgresql/data/

  resr-api:
    image: ghcr.io/cda-2025-re-sources-relationnelles/resr-api:latest
    build:
      context: .
      dockerfile: src/Presentation/Api/Dockerfile
    networks:
      - resr
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: "http://+:8080"
    command: ["-n", "-d"]
    depends_on:
      - db

networks:
  resr:

volumes:
  resr-db: